<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
    <h2>Spring Boot JPA & Security</h2>
    <div class="card">
        <div class="card-header">회원가입</div>
        <div class="card-body">
            <form th:action="@{/member/memberRegister}" method="post">
<!--                <input type="hidden" th:name="${_csrf.parameterName} th:value="${_csrf.token}"/>   << 이것은 시큐리티에서 필요한 인증 수단이여서 이값이 안넘어가면 디나이 시킨다 그래서 이값을 시큐리티와 관련된 화면 엔 무조건 넣어줘야 한다 JSP로 할때는 추가해줘야 한다 타임리프는 기본적으로 제공되서 안적어도 상관 없다 -서버단으로 전송할때- -->
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" class="form-control" placeholder="Enter username" id="username" name="username">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" class="form-control" placeholder="Enter password" id="password" name="password">
                </div>
                <div class="form-group">
                    <label for="customerName">CustomerName:</label>
                    <input type="text" class="form-control" placeholder="Enter customerName" id="customerName" name="customerName">
                </div>
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" class="form-control" placeholder="Enter age" id="age" name="age">
                </div>
                <div class="form-group">
                    <label for="rating">Rating:</label>
                    <input type="text" class="form-control" placeholder="Enter rating" id="rating" name="rating">
                </div>
                <div class="form-group">
                    <label for="occupation">Occupation:</label>
                    <input type="text" class="form-control" placeholder="Enter occupation" id="occupation" name="occupation">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" placeholder="Enter email" id="email" name="email">
                </div>
                <button type="submit" class="btn btn-primary btn-sm">가입</button>
                <button type="reset" class="btn btn-primary btn-sm">취소</button>
            </form>
        </div>
        <div class="card-footer">자바 스프링 풀스택 개발자 김남국</div>
    </div>
</div>

</body>
</html>
