<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
    <h2>Spring Boot JPA & Security</h2>
    <div class="card">
        <div class="card-header d-flex justify-content-center align-items-center">

            <!-- 로그인이 실패 하거나 로그인이 안된상태 -->
            <form class="form-inline" th:action="@{/loginProcess}" method="post">

                <div th:if="${error}" class="form-group mr-2">
                    <p style="color:red;">Login failed,Please try again.</p>
                </div>
                <div th:if="${logout}" class="form-group mr-2">
                    <p style="color:red;">You have been logged out successfully.</p>
                </div>

                <div class="form-group mr-2">
                    <label for="username">Username:</label>
                    <input type="text" class="form-control" placeholder="아이디" id="username" name="username">
                </div>
                <div class="form-group mr-2">
                    <label for="password">Password:</label>
                    <input type="password" class="form-control" placeholder="패스워드" id="password" name="password">
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Login</button>
            </form>
            <!-- 로그인이 성공하면
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>-->
            <div class="mx-2">
                <a th:href="@{/member/memberRegister}" class="btn btn-sm btn-secondary">회원가입</a>
            </div>
        </div>
        <div class="card-body">
            메인화면 들어갈 컨텐츠구성
        </div>
        <div class="card-footer">자바 스프링 풀스택 개발자 김남국</div>
    </div>
</div>

</body>
</html>
